name: Deploy Solution CMS

on:
  push:
    branches:
      - master
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Node.js
      # SPFx 1.20 requires Node 18
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm

      # =========================================================
      # 3. Verify Node/NPM Version
      # =========================================================
      - name: Verify Node Environment
        run: |
          echo "Node Version:"
          node -v

          echo "NPM Version:"
          npm -v

      # =========================================================
      # 4. Install Dependencies
      # Keeps existing dependency versions
      # =========================================================
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================
      # 5. Build and Package SPFx
      # =========================================================
      - name: Bundle and Package
        run: |
          npx gulp bundle --ship
          npx gulp package-solution --ship

      # =========================================================
      # 6. Verify SPPKG
      # =========================================================
      - name: Verify SPPKG
        run: |
          echo "Generated SPPKG files:"
          ls -lah sharepoint/solution

      # =========================================================
      # 7. Login to Microsoft 365
      # =========================================================
      - name: Login to Microsoft 365
        uses: pnp/action-cli-login@v4
        with:
          CERTIFICATE_ENCODED: ${{ secrets.CERTIFICATE_ENCODED }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APP_ID: ${{ secrets.APP_ID }}
          TENANT: ${{ secrets.TENANT_ID }}

      # =========================================================
      # 8. MASTER Branch -> DEV
      # =========================================================
      - name: Deploy CMS to DEV
        if: github.ref == 'refs/heads/master'
        id: devDeploy
        uses: pnp/action-cli-deploy@v6
        with:
          APP_FILE_PATH: sharepoint/solution/cms.sppkg
          SCOPE: sitecollection
          SITE_COLLECTION_URL: https://credentinfotec.sharepoint.com/sites/IntranetPortal-Dev
          SKIP_FEATURE_DEPLOYMENT: true
          OVERWRITE: true

      # =========================================================
      # 9. MAIN Branch -> PROD
      # =========================================================
      - name: Deploy CMS to PROD
        if: github.ref == 'refs/heads/main'
        id: prodDeploy
        uses: pnp/action-cli-deploy@v6
        with:
          APP_FILE_PATH: sharepoint/solution/cms.sppkg
          SCOPE: sitecollection
          SITE_COLLECTION_URL: https://credentinfotec.sharepoint.com/sites/NeulandLabs
          SKIP_FEATURE_DEPLOYMENT: true
          OVERWRITE: true

      # =========================================================
      # 10. DEV Deployment Result
      # =========================================================
      - name: DEV Deployment Result
        if: github.ref == 'refs/heads/master'
        run: |
          echo "======================================"
          echo "DEV Deployment Completed"
          echo "Site: IntranetPortal-Dev"
          echo "App ID: ${{ steps.devDeploy.outputs.APP_ID }}"
          echo "======================================"

      # =========================================================
      # 11. PROD Deployment Result
      # =========================================================
      - name: PROD Deployment Result
        if: github.ref == 'refs/heads/main'
        run: |
          echo "======================================"
          echo "PROD Deployment Completed"
          echo "Site: NeulandLabs"
          echo "App ID: ${{ steps.prodDeploy.outputs.APP_ID }}"
          echo "======================================"